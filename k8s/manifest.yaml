# rafal.lagowski.es: nginx serving the static site from ConfigMaps (filled by k8s/deploy.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: rafal-site
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rafal-site
  namespace: rafal-site
  labels: {app: rafal-site}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rafal-site}
  template:
    metadata:
      labels: {app: rafal-site}
      annotations:
        content-hash: "none"   # bumped by deploy.sh so content changes roll the pod
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 30
          volumeMounts:
            - {name: html, mountPath: /srv/html, readOnly: true}
            - {name: assets, mountPath: /srv/assets, readOnly: true}
            - {name: fonts, mountPath: /srv/fonts, readOnly: true}
            - {name: files, mountPath: /srv/files, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
        - name: html
          configMap: {name: rafal-site-html}
        - name: assets
          configMap: {name: rafal-site-assets}
        - name: fonts
          configMap: {name: rafal-site-fonts}
        - name: files
          projected:
            sources:
              - configMap: {name: rafal-site-files-a}
              - configMap: {name: rafal-site-files-b}
        - name: conf
          configMap: {name: rafal-site-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: rafal-site
  namespace: rafal-site
spec:
  selector: {app: rafal-site}
  ports: [{name: http, port: 80, targetPort: 80}]
---
# Contact form backend: k8s/contact.py (stdlib Python), SMTP credentials from the Secret rafal-site-smtp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rafal-contact
  namespace: rafal-site
  labels: {app: rafal-contact}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rafal-contact}
  template:
    metadata:
      labels: {app: rafal-contact}
      annotations:
        content-hash: "none"
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: contact
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/contact.py"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: CONTACT_TO, value: rafal@lagowski.es}
            - name: SMTP_USER
              valueFrom: {secretKeyRef: {name: rafal-site-smtp, key: SMTP_USER, optional: true}}
            - name: SMTP_PASS
              valueFrom: {secretKeyRef: {name: rafal-site-smtp, key: SMTP_PASS, optional: true}}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: rafal-contact-app}
---
apiVersion: v1
kind: Service
metadata:
  name: rafal-contact
  namespace: rafal-site
spec:
  selector: {app: rafal-contact}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: rafal-site
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rafal-site
  namespace: rafal-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [rafal.lagowski.es]
      secretName: rafal-lagowski-tls
  rules:
    - host: rafal.lagowski.es
      http:
        paths:
          - path: /api/contact
            pathType: Exact
            backend:
              service: {name: rafal-contact, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: rafal-site, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rafal-site-http
  namespace: rafal-site
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: rafal-site-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: rafal.lagowski.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: rafal-site, port: {name: http}}
