server {
  listen 80;
  server_name _;
  root /srv/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.youtube-nocookie.com; media-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  error_page 404 /404.html;

  location = /404.html { internal; add_header Cache-Control "no-cache"; }
  location /assets/fonts/ { alias /srv/fonts/; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
  location /assets/ { alias /srv/assets/; add_header Cache-Control "public, max-age=86400"; add_header X-Content-Type-Options nosniff always; }
  location /files/ { alias /srv/files/; add_header Cache-Control "public, max-age=86400"; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Strict-Transport-Security "max-age=31536000" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.youtube-nocookie.com; media-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always; }
}
